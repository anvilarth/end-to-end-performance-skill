<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">End-to-End Performance</title>
  <desc id="desc">A field guide for GPU systems. Measure the full path and prove the gain. A schematic trace connects input work, GPU compute and output.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d3e0db" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="348" rx="20" fill="#f3f6f5" stroke="#d3e0db"/>
  <rect x="704" y="27" width="466" height="296" rx="12" fill="url(#grid)" opacity="0.55"/>
  <rect x="51" y="45" width="8" height="17" rx="2" fill="#087e63"/>
  <text x="73" y="58" fill="#4a6560" font-family="monospace" font-size="14" letter-spacing="2.1">A FIELD GUIDE FOR GPU SYSTEMS</text>
  <g fill="#102a28" font-family="sans-serif" font-weight="700">
    <text x="49" y="139" font-size="59" letter-spacing="0.3">END-TO-END</text>
    <text x="49" y="206" font-size="64" letter-spacing="0.3">PERFORMANCE</text>
  </g>
  <text x="53" y="257" fill="#4a6560" font-family="sans-serif" font-size="23">Measure the full path. Prove the gain.</text>
  <path d="M 53 286 H 645" stroke="#d3e0db"/>
  <text x="53" y="313" fill="#087e63" font-family="monospace" font-size="12" letter-spacing="1.8">PROFILE / EXPERIMENT / VALIDATE</text>
  <text x="740" y="63" fill="#4a6560" font-family="monospace" font-size="12" letter-spacing="1.5">FOLLOW THE CRITICAL PATH</text>
  <g stroke="#d3e0db" stroke-width="1">
    <path d="M 818 126 H 1139 M 818 183 H 1139 M 818 240 H 1139"/>
  </g>
  <g fill="#4a6560" font-family="monospace" font-size="12">
    <text x="740" y="130">INPUT</text>
    <text x="740" y="187">GPU</text>
    <text x="740" y="244">OUTPUT</text>
  </g>
  <g fill="none" stroke="#087e63" stroke-width="2" stroke-dasharray="3 4" opacity="0.7">
    <path d="M 925 127 V 182 H 953"/>
    <path d="M 1082 182 V 239 H 1095"/>
  </g>
  <rect x="826" y="110" width="57" height="33" rx="5" fill="#deebe5" stroke="#d3e0db"/>
  <rect x="890" y="110" width="59" height="33" rx="5" fill="#deebe5" stroke="#d3e0db"/>
  <rect x="953" y="166" width="133" height="34" rx="5" fill="#087e63"/>
  <rect x="1095" y="223" width="43" height="33" rx="5" fill="#deebe5" stroke="#d3e0db"/>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <text x="854" y="131" fill="#102a28">READ</text>
    <text x="920" y="131" fill="#102a28">PREP</text>
    <text x="1019" y="188" fill="#ffffff" font-weight="700">COMPUTE</text>
    <text x="1116" y="244" fill="#102a28">SAVE</text>
  </g>
  <circle cx="826" cy="290" r="4" fill="#087e63"/>
  <path d="M 838 290 H 1138" stroke="#d3e0db"/>
  <text x="740" y="314" fill="#4a6560" font-family="monospace" font-size="11" letter-spacing="0.8">ONE WORKLOAD. A VERIFIED RESULT.</text>
</svg>
